name: Hamyra Movies Auto Scraper Bot

on:
  schedule:
    # প্রতি ১২ ঘন্টায় স্বয়ংক্রিয়ভাবে কোডটি রান হবে
    - cron: '0 */12 * * *'
  # গিটহাব থেকে ম্যানুয়ালি বোতাম চেপে চালু করার অপশন
  workflow_dispatch:

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # অটোমেটিক পুশ করার জন্য রাইট পারমিশন

    steps:
      - name: 📥 Repository Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🕸️ Run Python Scraper Script
        run: python scraper.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json movies.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto-Bot] Updated Movies Data - $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
