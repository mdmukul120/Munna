name: Hamyra Movies Advanced Auto Scraper Bot

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘন্টা পর পর অটোমেটিক চলবে
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Repository Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🕸️ Run Advanced Python Scraper Engine
        run: python scraper.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # সকল নতুন ফাইল ও ক্যাটাগরি ফোল্ডার গিট ট্র্যাকিংয়ে যুক্ত করা
          git add movies.json movies.csv data/
          
          # যদি কোনো পরিবর্তন থাকে তবেই কেবল Commit হবে
          if git status --porcelain | grep -q .; then
            git commit -m "🤖 [Auto-Bot] Updated Category & Movie Files - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "ℹ️ কোনো নতুন ডাটা পরিবর্তন পাওয়া যায়নি।"
          fi
